<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Um convite para você ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- TELA PRINCIPAL -->

        <section id="principal" class="card">

            <div class="emoji">
                💌
            </div>

            <span class="small-title">
                UM CONVITE ESPECIAL
            </span>

            <h1>
                Gabriela...
            </h1>

            <p class="pergunta">
                Aceita sair comigo<br>
                depois do culto sábado? ❤️
            </p>

            <div class="botoes">

                <button
                    id="aceitar"
                    class="aceitar">

                    Aceito ❤️

                </button>

                <button
                    id="pensar"
                    class="pensar">

                    Pensar um pouquinho 🤔

                </button>

            </div>

            <p
                id="mensagem"
                class="mensagem">
            </p>

        </section>


        <!-- TELA DE ACEITE -->

        <section
            id="sucesso"
            class="card hidden">

            <div id="efeitos"></div>

            <div class="emoji sucesso-emoji">
                🥰
            </div>

            <span class="small-title">
                CONVITE ACEITO
            </span>

            <h1>
                Então está combinado! ❤️
            </h1>

            <p>
                Sábado, depois do culto.
            </p>

            <p>
                Agora só falta decidir
                para onde vamos. 😌
            </p>

            <div class="coracao-grande">
                ❤️
            </div>

            <p class="final">
                Estou ansioso para te ver.
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
